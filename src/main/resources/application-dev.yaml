spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/MaridOne}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts: dev
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ADDRESS_USERNAME:}
    password: ${MAIL_ADDRESS_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET:dev-secret-change-me}

default:
  url: ${URL_HOST:http://localhost:5173}
  api-url: ${API_URL:http://localhost:8080}

holiday:
  enabled: true
  api-key: ${CALENDARIFIC_API_KEY:}
  country: PH
  base-url: https://calendarific.com/api/v2/holidays
  cache-dir: .cache/holidays
  override-file: .cache/holidays/holiday-overrides.json
  refresh-after: 1d
  connect-timeout: 5s
  request-timeout: 10s
