cloud:
  region: ${CLOUD_REGION:us-east-1}
  private-bucket-name: ${CLOUD_PRIVATE_BUCKET_NAME}

holiday:
  enabled: true
  api-key: ${CALENDARIFIC_API_KEY:}
  country: PH
  base-url: https://calendarific.com/api/v2/holidays
  cache-dir: .cache/holidays
  override-file: .cache/holidays/holiday-overrides.json
  refresh-after: 1d
  connect-timeout: 5s
  request-timeout: 10s

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ADDRESS_USERNAME}
    password: ${MAIL_ADDRESS_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
